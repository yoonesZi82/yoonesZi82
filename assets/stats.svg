<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="130" viewBox="0 0 1100 130" role="img" aria-label="Stats">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#0b162c"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="130" rx="16" fill="url(#sbg)" stroke="#1e3a5f" stroke-width="1.5"/>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="140" y="58" fill="#f8fafc" font-size="42" font-weight="800">5+
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="140" y="90" fill="#94a3b8" font-size="15">Years Experience</text>

    <text x="390" y="58" fill="#f8fafc" font-size="42" font-weight="800">20+
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
    </text>
    <text x="390" y="90" fill="#94a3b8" font-size="15">Projects Delivered</text>

    <text x="640" y="58" fill="#f8fafc" font-size="42" font-weight="800">∞
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="90" fill="#94a3b8" font-size="15">Always Learning</text>

    <text x="900" y="52" fill="#e2e8f0" font-size="16" font-style="italic">“Better code. Better products.</text>
    <text x="900" y="78" fill="#e2e8f0" font-size="16" font-style="italic">A better tomorrow.”</text>
  </g>

  <line x1="265" y1="30" x2="265" y2="100" stroke="#1e293b"/>
  <line x1="515" y1="30" x2="515" y2="100" stroke="#1e293b"/>
  <line x1="765" y1="30" x2="765" y2="100" stroke="#1e293b"/>
</svg>
