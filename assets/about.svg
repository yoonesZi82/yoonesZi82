<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-label="About Me">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#0d1833"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="560" height="560" rx="22" fill="url(#card)" stroke="#1e3a5f" stroke-width="2"/>

  <circle cx="78" cy="78" r="42" fill="#0b1a36" stroke="#3b82f6" stroke-width="3" filter="url(#g)">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="78" r="48" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1.5">
    <animate attributeName="r" values="46;52;46" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="90" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Y</text>

  <text x="140" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">About Me</text>
  <text x="140" y="82" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">I'm Yoones, a Frontend-focused Fullstack</text>
  <text x="140" y="102" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Developer building modern web apps with</text>
  <text x="140" y="122" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">React, Next.js, TypeScript and Node.js.</text>
  <text x="140" y="142" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Passionate about fast, scalable UX.</text>

  <line x1="28" y1="175" x2="532" y2="175" stroke="#1e293b" stroke-width="1"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cbd5e1">
    <text x="40" y="205">📍 Remote</text>
    <text x="165" y="205">&lt;/&gt; Fullstack Developer</text>
    <text x="365" y="205">🎓 Computer Engineering</text>
  </g>

  <line x1="28" y1="228" x2="532" y2="228" stroke="#1e293b" stroke-width="1"/>

  <text x="28" y="262" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Focus</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="28" y="276" width="155" height="36" rx="8" fill="#12203a" stroke="#1e3a5f"/>
    <text x="105" y="299" text-anchor="middle" fill="#93c5fd">Next.js Apps</text>
    <rect x="195" y="276" width="145" height="36" rx="8" fill="#12203a" stroke="#1e3a5f"/>
    <text x="267" y="299" text-anchor="middle" fill="#93c5fd">UI Systems</text>
    <rect x="352" y="276" width="180" height="36" rx="8" fill="#12203a" stroke="#1e3a5f"/>
    <text x="442" y="299" text-anchor="middle" fill="#93c5fd">Realtime Features</text>
  </g>

  <text x="28" y="350" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Currently</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">
    <text x="28" y="378">⚡ Building scalable monorepo products</text>
    <text x="28" y="404">🧩 Leveling up NestJS, Prisma and DX</text>
    <text x="28" y="430">🌍 Open to remote / freelance work</text>
  </g>

  <line x1="28" y1="455" x2="532" y2="455" stroke="#1e293b" stroke-width="1"/>

  <text x="28" y="490" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Languages</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="28" y="505" width="120" height="32" rx="8" fill="#12203a" stroke="#1e3a5f"/>
    <text x="88" y="526" text-anchor="middle" fill="#93c5fd">🇮🇷 Persian</text>
    <rect x="160" y="505" width="120" height="32" rx="8" fill="#12203a" stroke="#1e3a5f"/>
    <text x="220" y="526" text-anchor="middle" fill="#93c5fd">🇬🇧 English</text>
    <circle cx="330" cy="521" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="345" y="526" fill="#86efac" font-size="13">Available for hire</text>
  </g>
</svg>
