<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Yoones Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="55%" stop-color="#0a1630"/>
      <stop offset="100%" stop-color="#07101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="winClip"><rect x="620" y="70" width="400" height="230" rx="14"/></clipPath>
  </defs>

  <rect width="1100" height="360" fill="url(#bg)"/>
  <rect width="1100" height="360" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#dbeafe">
    <circle cx="90" cy="40" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="55" r="1.3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="120" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="200" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="280" r="1.3"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="300" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="180" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbits -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1">
    <ellipse cx="780" cy="200" rx="260" ry="120"/>
    <ellipse cx="780" cy="200" rx="200" ry="90"/>
    <path d="M40 320 C220 250, 360 310, 520 280"/>
  </g>

  <text x="48" y="48" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14">github.com/yoonesZi82</text>

  <text x="48" y="145" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="4" filter="url(#softGlow)">YOONES
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="52" y="185" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="10">DEVELOPER</text>
  <line x1="210" y1="178" x2="320" y2="178" stroke="#64748b" stroke-dasharray="4 6" stroke-width="1.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="52" y="300" fill="#94a3b8" font-family="Georgia, serif" font-size="18" font-style="italic">Build  /  Solve  /  Improve</text>

  <!-- code window -->
  <rect x="620" y="70" width="400" height="230" rx="14" fill="#050a14" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="620" y="70" width="400" height="36" rx="14" fill="#0b1628"/>
  <rect x="620" y="92" width="400" height="14" fill="#0b1628"/>
  <circle cx="646" cy="88" r="5" fill="#ef4444"/>
  <circle cx="666" cy="88" r="5" fill="#eab308"/>
  <circle cx="686" cy="88" r="5" fill="#22c55e"/>
  <text x="720" y="92" fill="#64748b" font-family="Consolas, monospace" font-size="12">portfolio.tsx</text>

  <g clip-path="url(#winClip)" font-family="Consolas, Monaco, monospace" font-size="14">
    <text x="645" y="140" fill="#64748b">1</text>
    <text x="670" y="140"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> build = () =&gt; {</tspan></text>

    <text x="645" y="168" fill="#64748b">2</text>
    <text x="690" y="168"><tspan fill="#c084fc">return</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#67e8f9">&lt;App</tspan><tspan fill="#fbbf24"> solve</tspan><tspan fill="#e2e8f0">=</tspan><tspan fill="#86efac">"better"</tspan><tspan fill="#67e8f9"> /&gt;</tspan></text>

    <text x="645" y="196" fill="#64748b">3</text>
    <text x="670" y="196" fill="#e2e8f0">}</text>

    <text x="645" y="224" fill="#64748b">4</text>
    <text x="670" y="224"><tspan fill="#64748b">// </tspan><tspan fill="#93c5fd">always improve</tspan></text>

    <text x="645" y="252" fill="#64748b">5</text>
    <text x="670" y="252" fill="#86efac">build()</text>

    <!-- typing cursor -->
    <rect x="735" y="238" width="9" height="16" fill="#38bdf8" rx="1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- scan line -->
    <rect x="620" y="106" width="400" height="2" fill="#38bdf8" opacity="0.15">
      <animate attributeName="y" values="106;290;106" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
